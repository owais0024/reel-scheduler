name: Renew Instagram token (not needed)

# The current Meta system-user token never expires, so this job no longer
# runs on a schedule. It can still be started by hand if ever needed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - run: echo "The Instagram token never expires; nothing to renew."
