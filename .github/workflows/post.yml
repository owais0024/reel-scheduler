name: Post reel

on:
  schedule:
    # Every 30 minutes; posts whatever reel's date and time (Pakistan) has arrived.
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test only (checks everything, posts nothing)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: post-reel
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install --quiet requests

      - name: Post the next due reel
        run: python post.py
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          SHEET_URL: ${{ secrets.SHEET_URL }}
