name: Post reel

on:
  schedule:
    # 00:23 UTC = 5:23 am Pakistan, 7:23 pm New York (winter).
    # Two backup runs in case GitHub skips one; only one reel posts per day.
    - cron: "23 0 * * *"
    - cron: "47 1 * * *"
    - cron: "13 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test only (checks everything, posts nothing)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: post-reel
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          pip install --quiet requests
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Post the next due reel
        run: python post.py
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          SHEET_URL: ${{ secrets.SHEET_URL }}
