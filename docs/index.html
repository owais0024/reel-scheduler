<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Reel Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: top bar, month grid (desktop) or day list (phone), side sheet editor. Black and gold from the profile mark. */
:root{
  --bg:#f6f5f2; --panel:#ffffff; --ink:#151412; --muted:#6d6a63; --line:#e4e1da;
  --gold:#b8913a; --gold-ink:#ffffff; --today:#fbf3e0;
  --posted-bg:#dcf2e4; --posted-fg:#0d5c2c;
  --ready-bg:#e1eafb; --ready-fg:#1b428c;
  --miss-bg:#fdebcf; --miss-fg:#8a4b00;
  --hold-bg:#ecebe8; --hold-fg:#55524c;
  --err-bg:#fbdcdc; --err-fg:#8a1414;
  --shadow:0 10px 30px rgba(20,18,14,.14);
  --display:'DM Serif Display',Georgia,serif;
  --ui:Inter,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121110; --panel:#1b1a18; --ink:#f1efe9; --muted:#a19d94; --line:#2f2d29;
  --gold:#d2ad5a; --gold-ink:#151412; --today:#2a2416;
  --posted-bg:#173b25; --posted-fg:#9fe0b6; --ready-bg:#1c2b49; --ready-fg:#a9c3f5;
  --miss-bg:#45300f; --miss-fg:#f3c37c; --hold-bg:#2c2b29; --hold-fg:#bdb9b1;
  --err-bg:#4a1c1c; --err-fg:#f3a7a7; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121110; --panel:#1b1a18; --ink:#f1efe9; --muted:#a19d94; --line:#2f2d29;
  --gold:#d2ad5a; --gold-ink:#151412; --today:#2a2416;
  --posted-bg:#173b25; --posted-fg:#9fe0b6; --ready-bg:#1c2b49; --ready-fg:#a9c3f5;
  --miss-bg:#45300f; --miss-fg:#f3c37c; --hold-bg:#2c2b29; --hold-fg:#bdb9b1;
  --err-bg:#4a1c1c; --err-fg:#f3a7a7; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-block:16px 40px}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-top:env(safe-area-inset-top,0px)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.mark{width:38px;height:38px;border-radius:50%;background:#111;display:grid;place-items:center;flex:none}
.mark svg{width:16px;height:16px}
.brand h1{font:400 24px/1 var(--display);margin:0}
.brand small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 12px;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.btn.danger{color:var(--err-fg)}
.btn:disabled{opacity:.55;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:8px 12px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.summary{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 12px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.s-posted{background:var(--posted-bg);color:var(--posted-fg)}
.s-ready{background:var(--ready-bg);color:var(--ready-fg)}
.s-miss{background:var(--miss-bg);color:var(--miss-fg)}
.s-hold{background:var(--hold-bg);color:var(--hold-fg)}
.s-err{background:var(--err-bg);color:var(--err-fg)}
.monthbar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.monthbar h2{font:400 22px/1 var(--display);margin:0 auto 0 0}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--line);gap:1px}
.dow{background:var(--panel);padding:8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.day{background:var(--panel);min-height:132px;padding:6px;display:flex;flex-direction:column;gap:6px;min-width:0}
.day.out{background:var(--bg)}
.day.today{background:var(--today)}
.day.drop{outline:2px dashed var(--gold);outline-offset:-4px}
.dnum{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.dnum .add{border:0;background:none;color:var(--muted);font-size:16px;line-height:1;padding:0 4px;opacity:0}
.day:hover .add{opacity:1}
.card{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:5px;background:var(--panel);text-align:left;width:100%;min-width:0}
.card:hover{border-color:var(--muted)}
.card[draggable="true"]{cursor:grab}
.thumb{width:36px;aspect-ratio:9/16;border-radius:6px;background:#111 center/cover no-repeat;flex:none;display:grid;place-items:center;color:#777;font-size:10px}
.cbody{min-width:0;flex:1}
.cap{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12px;line-height:1.3;word-break:break-word}
.meta{display:flex;align-items:center;gap:6px;margin-top:4px;flex-wrap:wrap}
.meta .chip{padding:1px 7px;font-size:10.5px}
.time{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:18px}
.lgroup h3{font:600 12px/1 var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.lgroup .card{padding:10px;gap:12px}
.lgroup .thumb{width:54px}
.lgroup .cap{-webkit-line-clamp:3;font-size:13.5px}
.empty{border:1px dashed var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--muted)}
.hint{color:var(--muted);font-size:12px;margin-top:12px}
/* Side sheet */
.scrim{position:fixed;inset:0;background:rgba(10,9,8,.45);z-index:20}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--panel);z-index:21;box-shadow:var(--shadow);
  display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.sheet header{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet header h2{font:400 21px/1.1 var(--display);margin:0 auto 0 0}
.x{border:0;background:none;font-size:22px;line-height:1;padding:4px 8px;color:var(--muted)}
.sbody{overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.preview{display:flex;gap:14px;align-items:flex-start}
.player{width:160px;aspect-ratio:9/16;border-radius:12px;overflow:hidden;background:#111;flex:none;display:grid;place-items:center;color:#888;font-size:12px;text-align:center;padding:8px}
.player iframe,.player video{width:100%;height:100%;border:0;display:block}
.pinfo{min-width:0;display:flex;flex-direction:column;gap:8px}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:12.5px}
label.f span.sub{font-weight:400;color:var(--muted)}
input[type=date],input[type=password],input[type=text],textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;width:100%}
textarea{min-height:190px;resize:vertical;line-height:1.45}
.count{align-self:flex-end;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.count.over{color:var(--err-fg);font-weight:700}
.toggle{display:flex;align-items:center;gap:10px;font-weight:600}
.toggle input{width:18px;height:18px;accent-color:var(--gold)}
.drop-zone{border:1.5px dashed var(--line);border-radius:12px;padding:16px;text-align:center;color:var(--muted)}
.drop-zone.over{border-color:var(--gold);color:var(--ink)}
.sfoot{margin-top:auto;display:flex;gap:8px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.sfoot .spacer{margin-right:auto}
.confirm{display:flex;gap:8px;align-items:center;background:var(--err-bg);color:var(--err-fg);border-radius:10px;padding:8px 10px;width:100%;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;z-index:30;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
.lock{max-width:380px;margin:12vh auto 0;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:14px;text-align:center}
.lock h1{font:400 28px/1.1 var(--display);margin:0}
.lock p{margin:0;color:var(--muted)}
.lock input{text-align:center;font-size:22px;letter-spacing:.3em}
.err{color:var(--err-fg);font-size:13px;min-height:1.2em}
.loading{color:var(--muted);padding:40px 0;text-align:center}
@media (max-width:760px){
  .brand h1{font-size:21px}
  .player{width:120px}
  .preview{flex-direction:row}
}
@media (prefers-reduced-motion:no-preference){.sheet{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loading">Loading…</div></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbw5mMc9ttzwVWsa6FYZBvBYll3oYVgBkZRWnMoHXEPTbFxEfAHwoFZgd0spURgbqZhyjg/exec';
const SLOTS = ['05:23','18:23','22:23']; // Pakistan time = 7:23 pm, 8:23 am, 12:23 pm New York
const DEFAULT_TIME = '05:23';
const MAX_CAPTION = 2200;

const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} },
};
const S = { pin: store.get('rp_pin') || '', rows: [], files: {}, view: store.get('rp_view') || (innerWidth < 760 ? 'list' : 'calendar'), month: null, open: null, busy: false };
const $ = (sel, el=document) => el.querySelector(sel);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayIso = () => iso(new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Karachi' })));
const parseIso = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

function statusOf(r){
  const s = (r.status || '').toLowerCase();
  if (s.startsWith('posted')) return ['Posted','s-posted'];
  if (s.startsWith('hold')) return ['On hold','s-hold'];
  if (s.startsWith('error')) return ['Error','s-err'];
  if (s.startsWith('video missing') || !r.video || !S.files[r.video] && s !== 'ready') return ['Video missing','s-miss'];
  return ['Scheduled','s-ready'];
}
function tOf(r){ return (r && r.time) || DEFAULT_TIME; }
function fmtTime(t){ const [h,m] = t.split(':').map(Number); return `${(h%12)||12}:${pad(m)} ${h<12?'am':'pm'}`; }
function nyTime(date, t){
  const [y,mo,d] = date.split('-').map(Number); const [h,mi] = t.split(':').map(Number);
  const utc = new Date(Date.UTC(y, mo-1, d, h-5, mi));
  return utc.toLocaleString('en-US', { timeZone:'America/New_York', weekday:'short', hour:'numeric', minute:'2-digit' });
}
function byWhen(a,b){ return (a.date+' '+tOf(a)).localeCompare(b.date+' '+tOf(b)); }
function thumbUrl(r){ const id = S.files[r.video]; return id ? `https://drive.google.com/thumbnail?id=${id}&sz=w320` : ''; }
function firstLine(c){ return (c || '').split('\n').find(l => l.trim()) || 'No caption yet'; }
function toast(msg){ const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }

async function api(body){
  let res;
  if (!body) res = await fetch(`${API}?key=${encodeURIComponent(S.pin)}&t=${Date.now()}`);
  else res = await fetch(API, { method: 'POST', body: JSON.stringify({ key: S.pin, ...body }) });
  const data = await res.json();
  if (data.error === 'wrong_pin') { S.pin = ''; store.del('rp_pin'); renderLock('That PIN did not work. Check the PIN tab in your Reel Control Panel sheet.'); throw new Error('pin'); }
  if (!data.ok) throw new Error(data.error || 'Something went wrong');
  return data;
}
function apply(data){ S.rows = data.rows; S.files = data.files || {}; }

async function load(){
  if (!S.pin) return renderLock();
  $('#app').innerHTML = '<div class="loading">Loading your reels…</div>';
  try { apply(await api()); render(); }
  catch(e){ if (e.message !== 'pin') $('#app').innerHTML = `<div class="empty">Couldn't load the schedule (${esc(e.message)}). <button class="btn" onclick="load()">Try again</button></div>`; }
}

function renderLock(msg=''){
  $('#app').innerHTML = `
  <form class="lock" id="lock">
    <div class="mark" style="margin:0 auto">${playMark()}</div>
    <h1>Reel Planner</h1>
    <p>Enter your 8-digit PIN. It's in the <b>PIN</b> tab of your Reel Control Panel sheet.</p>
    <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="12" aria-label="PIN">
    <div class="err">${esc(msg)}</div>
    <button class="btn primary" type="submit">Open planner</button>
  </form>`;
  $('#pin').focus();
  $('#lock').addEventListener('submit', e => { e.preventDefault(); S.pin = $('#pin').value.trim(); if (!S.pin) return; store.set('rp_pin', S.pin); load(); });
}
function playMark(){ return '<svg viewBox="0 0 150 170" aria-hidden="true"><path d="M10 8 L140 85 L10 162 Z" fill="#C9A24A"/></svg>'; }

function render(){
  const counts = { 'Scheduled':0, 'Video missing':0, 'On hold':0, 'Posted':0, 'Error':0 };
  S.rows.forEach(r => counts[statusOf(r)[0]]++);
  const cls = { 'Scheduled':'s-ready','Video missing':'s-miss','On hold':'s-hold','Posted':'s-posted','Error':'s-err' };
  const next = S.rows.filter(r => r.date >= todayIso() && statusOf(r)[0] === 'Scheduled').sort(byWhen)[0];
  $('#app').innerHTML = `
  <header class="top">
    <div class="brand"><div class="mark">${playMark()}</div><div><h1>Reel Planner</h1><small>@edits.by.owais · up to 3 reels a day${next ? ` · next: ${fmtShort(next.date)}, ${fmtTime(tOf(next))}` : ''}</small></div></div>
    <div class="seg" role="group" aria-label="View">
      <button id="vCal" aria-pressed="${S.view==='calendar'}">Calendar</button>
      <button id="vList" aria-pressed="${S.view==='list'}">List</button>
    </div>
    <button class="btn" id="refresh" title="Reload from the sheet">Refresh</button>
    <button class="btn primary" id="newBtn">+ New post</button>
  </header>
  <div class="summary">${Object.entries(counts).filter(([k,v]) => v || k==='Scheduled').map(([k,v]) => `<span class="chip ${cls[k]}">${v} ${k.toLowerCase()}</span>`).join('')}</div>
  <main id="main"></main>`;
  $('#vCal').onclick = () => { S.view = 'calendar'; store.set('rp_view','calendar'); render(); };
  $('#vList').onclick = () => { S.view = 'list'; store.set('rp_view','list'); render(); };
  $('#refresh').onclick = load;
  $('#newBtn').onclick = () => { const s = nextFreeSlot(); openEditor(null, s.date, s.time); };
  S.view === 'calendar' ? renderCalendar() : renderList();
}
function fmtShort(s){ const d = parseIso(s); return `${DOW[(d.getDay()+6)%7]} ${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)}`; }
function nextFreeSlot(from){
  const taken = new Set(S.rows.map(r => r.date + ' ' + tOf(r)));
  const nowK = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Karachi' }));
  const nowStr = `${iso(nowK)} ${pad(nowK.getHours())}:${pad(nowK.getMinutes())}`;
  let d = parseIso(from || todayIso());
  for (let i=0; i<400; i++){
    for (const t of SLOTS){ const k = `${iso(d)} ${t}`; if (k > nowStr && !taken.has(k)) return { date: iso(d), time: t }; }
    d.setDate(d.getDate()+1);
  }
  return { date: todayIso(), time: DEFAULT_TIME };
}

function cardHtml(r, drag){
  const [label, cls] = statusOf(r); const t = thumbUrl(r);
  return `<button class="card" data-row="${r.row}" ${drag && label !== 'Posted' ? 'draggable="true"' : ''}>
    <span class="thumb" ${t ? `style="background-image:url('${t}')"` : ''}>${t ? '' : '▶'}</span>
    <span class="cbody"><span class="cap">${esc(firstLine(r.caption))}</span>
      <span class="meta"><span class="chip ${cls}">${label}</span><span class="time">${label==='Posted' && r.posted_at ? esc(r.posted_at.slice(11)) : fmtTime(tOf(r))}</span></span></span>
  </button>`;
}

function renderCalendar(){
  if (!S.month){ const t = parseIso(todayIso()); S.month = new Date(t.getFullYear(), t.getMonth(), 1); }
  const m = S.month, first = new Date(m.getFullYear(), m.getMonth(), 1);
  const start = new Date(first); start.setDate(1 - ((first.getDay()+6)%7));
  const byDate = {}; S.rows.slice().sort(byWhen).forEach(r => (byDate[r.date] = byDate[r.date] || []).push(r));
  const today = todayIso(); let cells = '';
  for (let i=0; i<42; i++){
    const d = new Date(start); d.setDate(start.getDate()+i); const k = iso(d);
    if (i === 35 && d.getMonth() !== m.getMonth()) break;
    cells += `<div class="day ${d.getMonth()!==m.getMonth()?'out':''} ${k===today?'today':''}" data-date="${k}">
      <div class="dnum"><span>${d.getDate()}</span><button class="add" data-add="${k}" title="New post on this day" aria-label="New post on ${k}">+</button></div>
      ${(byDate[k]||[]).map(r => cardHtml(r, true)).join('')}</div>`;
  }
  $('#main').innerHTML = `
    <div class="monthbar"><h2>${MONTHS[m.getMonth()]} ${m.getFullYear()}</h2>
      <button class="btn" id="prev" aria-label="Previous month">‹</button><button class="btn" id="tod">Today</button><button class="btn" id="nxt" aria-label="Next month">›</button></div>
    <div style="overflow-x:auto"><div class="grid" style="min-width:700px">${DOW.map(d=>`<div class="dow">${d}</div>`).join('')}${cells}</div></div>
    <p class="hint">Drag a card to another day to reschedule. Click a card to watch it, edit the caption or put it on hold.</p>`;
  $('#prev').onclick = () => { S.month = new Date(m.getFullYear(), m.getMonth()-1, 1); renderCalendar(); };
  $('#nxt').onclick = () => { S.month = new Date(m.getFullYear(), m.getMonth()+1, 1); renderCalendar(); };
  $('#tod').onclick = () => { S.month = null; renderCalendar(); };
  wireCards();
  document.querySelectorAll('[data-add]').forEach(b => b.onclick = e => { e.stopPropagation(); const s = nextFreeSlot(b.dataset.add); openEditor(null, s.date === b.dataset.add ? s.date : b.dataset.add, s.date === b.dataset.add ? s.time : SLOTS[0]); });
  document.querySelectorAll('.day').forEach(day => {
    day.addEventListener('dragover', e => { e.preventDefault(); day.classList.add('drop'); });
    day.addEventListener('dragleave', () => day.classList.remove('drop'));
    day.addEventListener('drop', async e => {
      e.preventDefault(); day.classList.remove('drop');
      const row = Number(e.dataTransfer.getData('text/plain')); const r = S.rows.find(x => x.row === row);
      if (!r || r.date === day.dataset.date) return;
      const old = r.date; r.date = day.dataset.date; renderCalendar();
      try { apply(await api({ action:'update', row, date: day.dataset.date })); toast(`Moved to ${fmtShort(day.dataset.date)}`); render(); }
      catch(err){ r.date = old; renderCalendar(); if (err.message !== 'pin') toast(err.message); }
    });
  });
}

function renderList(){
  const today = todayIso();
  const up = S.rows.filter(r => !statusOf(r)[0].startsWith('Posted')).sort(byWhen);
  const done = S.rows.filter(r => statusOf(r)[0].startsWith('Posted')).sort((a,b)=>byWhen(b,a));
  const group = (title, rows) => rows.length ? `<section class="lgroup"><h3>${title}</h3><div style="display:flex;flex-direction:column;gap:8px">${rows.map(r => `<div><div class="time" style="margin:0 0 4px 2px">${fmtShort(r.date)}${r.date===today?' · today':''} · ${fmtTime(tOf(r))}</div>${cardHtml(r,false)}</div>`).join('')}</div></section>` : '';
  $('#main').innerHTML = `<div class="list">${group('Coming up', up) || '<div class="empty">Nothing scheduled. Tap + New post to add a reel.</div>'}${group('Posted', done)}</div>`;
  wireCards();
}

function wireCards(){
  document.querySelectorAll('.card').forEach(c => {
    c.onclick = () => openEditor(S.rows.find(r => r.row === Number(c.dataset.row)));
    c.addEventListener('dragstart', e => e.dataTransfer.setData('text/plain', c.dataset.row));
  });
}

/* ---------- editor ---------- */
function openEditor(r, date, time){
  closeEditor();
  const isNew = !r; const [label, cls] = r ? statusOf(r) : ['New','s-ready'];
  const posted = label === 'Posted'; const id = r && S.files[r.video];
  const wrap = document.createElement('div'); wrap.id = 'editor';
  wrap.innerHTML = `<div class="scrim"></div>
  <aside class="sheet" role="dialog" aria-modal="true" aria-label="${isNew ? 'New post' : 'Edit post'}">
    <header><h2>${isNew ? 'New post' : esc(fmtShort(r.date))}</h2>${isNew ? '' : `<span class="chip ${cls}">${label}</span>`}<button class="x" id="close" aria-label="Close">×</button></header>
    <div class="sbody">
      <div class="preview">
        <div class="player" id="player">${id ? `<iframe src="https://drive.google.com/file/d/${id}/preview" allow="autoplay" title="Reel preview"></iframe>` : (r && r.video ? `${esc(r.video)}<br>not uploaded yet` : 'No video yet')}</div>
        <div class="pinfo">
          ${posted && r.link ? `<a class="btn" href="${esc(r.link)}" target="_blank" rel="noopener">View on Instagram ↗</a>` : ''}
          ${posted ? `<div class="time">Posted ${esc(r.posted_at)}</div>` : ''}
          ${r && r.video ? `<div class="time">File: ${esc(r.video)}</div>` : ''}
          ${!posted ? `<label class="drop-zone" id="dz"><input type="file" id="file" accept="video/*" hidden><span id="dzText">${id ? 'Replace video' : 'Choose or drop a video'}</span></label>` : ''}
        </div>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <label class="f" style="flex:1 1 150px">Date<input type="date" id="date" value="${esc(r ? r.date : date)}" ${posted ? 'disabled' : ''}></label>
        <label class="f" style="flex:1 1 150px">Time (Pakistan)<input type="time" id="time" value="${esc(r ? tOf(r) : (time || DEFAULT_TIME))}" ${posted ? 'disabled' : ''}></label>
      </div>
      ${posted ? '' : `<div class="slots" style="display:flex;gap:6px;flex-wrap:wrap">${SLOTS.map(t => `<button type="button" class="btn" data-slot="${t}" style="padding:5px 9px;font-size:12px">${fmtTime(t)}</button>`).join('')}</div>`}
      <div class="time" id="ny"></div>
      <label class="f">Caption
        <textarea id="caption" ${posted ? 'readonly' : ''} placeholder="Hook line, reference, call to action, hashtags">${esc(r ? r.caption : '')}</textarea>
        <span class="count" id="count"></span></label>
      ${posted ? '' : `<label class="toggle"><input type="checkbox" id="hold" ${r && label==='On hold' ? 'checked' : ''}> Hold (don't post until I untick this)</label>`}
      ${r && label==='Error' ? `<div class="chip s-err" style="white-space:normal">Last attempt failed. Saving will try again at the next posting time.</div>` : ''}
    </div>
    <div class="sfoot" id="foot">
      ${!isNew && !posted ? '<button class="btn danger" id="del">Delete</button>' : ''}<span class="spacer"></span>
      <button class="btn" id="cancel">${posted ? 'Close' : 'Cancel'}</button>
      ${posted ? '' : `<button class="btn primary" id="save">${isNew ? 'Schedule' : 'Save'}</button>`}
    </div>
  </aside>`;
  document.body.appendChild(wrap);
  let file = null;
  const cap = $('#caption'), cnt = $('#count');
  const upd = () => { const n = cap.value.length; cnt.textContent = `${n.toLocaleString()} / ${MAX_CAPTION.toLocaleString()}`; cnt.classList.toggle('over', n > MAX_CAPTION); };
  cap.addEventListener('input', upd); upd();
  const ny = () => { const d = $('#date').value, t = $('#time').value; $('#ny').textContent = d && t ? `Goes live ${nyTime(d, t)} in New York` : ''; };
  $('#date').addEventListener('input', ny); $('#time').addEventListener('input', ny); ny();
  document.querySelectorAll('[data-slot]').forEach(b => b.onclick = () => { $('#time').value = b.dataset.slot; ny(); });
  $('.scrim').onclick = closeEditor; $('#close').onclick = closeEditor; $('#cancel').onclick = closeEditor;
  document.addEventListener('keydown', escKey);
  const dz = $('#dz');
  if (dz){
    const pick = f => { if (!f) return; if (!f.type.startsWith('video')) return toast('Choose a video file'); if (f.size > 35e6) return toast('Video is over 35 MB. Export it smaller (1080x1920, under 2 minutes).');
      file = f; $('#dzText').textContent = `${f.name} (${(f.size/1e6).toFixed(1)} MB)`; $('#player').innerHTML = `<video src="${URL.createObjectURL(f)}" controls playsinline muted></video>`; };
    $('#file').onchange = e => pick(e.target.files[0]);
    dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('over'); });
    dz.addEventListener('dragleave', () => dz.classList.remove('over'));
    dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('over'); pick(e.dataTransfer.files[0]); });
  }
  const save = $('#save');
  if (save) save.onclick = async () => {
    const body = { action: isNew ? 'create' : 'update', date: $('#date').value, time: $('#time').value || DEFAULT_TIME, caption: cap.value, hold: $('#hold').checked };
    if (!isNew) body.row = r.row;
    if (!body.date) return toast('Pick a date');
    if (cap.value.length > MAX_CAPTION) return toast('Caption is too long for Instagram');
    if (isNew && !file) return toast('Add a video first');
    save.disabled = true; save.textContent = file ? 'Uploading…' : 'Saving…';
    try {
      if (file){ body.data = await toB64(file); body.mime = file.type || 'video/mp4'; body.filename = cleanName(file.name, body.date); }
      apply(await api(body)); closeEditor(); render(); toast(isNew ? `Scheduled for ${fmtShort(body.date)}, ${fmtTime(body.time)}` : 'Saved');
    } catch(e){ save.disabled = false; save.textContent = isNew ? 'Schedule' : 'Save'; if (e.message !== 'pin') toast(e.message); }
  };
  const del = $('#del');
  if (del) del.onclick = () => {
    $('#foot').innerHTML = `<div class="confirm">Delete this post from the schedule? The video stays in Drive. <span class="spacer" style="margin-right:auto"></span><button class="btn" id="no">Keep it</button><button class="btn primary" id="yes" style="background:var(--err-fg);border-color:var(--err-fg)">Delete</button></div>`;
    $('#no').onclick = () => openEditor(r);
    $('#yes').onclick = async () => { $('#yes').disabled = true; try { apply(await api({ action:'delete', row: r.row })); closeEditor(); render(); toast('Deleted'); } catch(e){ if (e.message !== 'pin') toast(e.message); } };
  };
}
function escKey(e){ if (e.key === 'Escape') closeEditor(); }
function closeEditor(){ const el = $('#editor'); if (el) el.remove(); document.removeEventListener('keydown', escKey); }
function cleanName(name, date){ const ext = (name.match(/\.[a-z0-9]+$/i) || ['.mp4'])[0].toLowerCase(); const base = name.replace(/\.[^.]+$/,'').replace(/[^a-z0-9-_]+/gi,'-').replace(/^-|-$/g,'').slice(0,40) || 'reel'; return `${date}-${base}${ext}`; }
function toB64(f){ return new Promise((ok, bad) => { const fr = new FileReader(); fr.onload = () => ok(String(fr.result).split(',')[1]); fr.onerror = () => bad(new Error('Could not read the video')); fr.readAsDataURL(f); }); }

load();
</script>
</body>
</html>
